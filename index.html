<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday Mumma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Elegant Google Fonts for Calligraphy & Serif Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #070514;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* Calligraphic & Serif Fonts */
        .font-calligraphy {
            font-family: 'Great Vibes', cursive;
        }
        .font-serif-elegant {
            font-family: 'Cormorant Garamond', serif;
        }

        /* Animated Rose-Gold & Champagne Shimmer Text */
        .shimmer-title {
            background: linear-gradient(
                110deg,
                #fde68a 12%,
                #ffffff 30%,
                #f9a8d4 48%,
                #fcd34d 66%,
                #ffffff 84%,
                #fde68a 96%
            );
            background-size: 250% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: goldenShimmer 6s linear infinite;
            filter: drop-shadow(0 4px 24px rgba(251, 191, 36, 0.38));
        }

        @keyframes goldenShimmer {
            0% { background-position: 0% center; }
            100% { background-position: 250% center; }
        }

        /* Floating Translucent Glassmorphic Card */
        .glass-card {
            background: linear-gradient(
                145deg,
                rgba(24, 15, 42, 0.46) 0%,
                rgba(38, 18, 48, 0.34) 100%
            );
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(253, 230, 138, 0.25);
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.45),
                inset 0 1px 1px rgba(255, 255, 255, 0.18);
            animation: cardEntrance 2s cubic-bezier(0.22, 1, 0.36, 1) forwards,
                       gentleFloat 7s ease-in-out 2s infinite;
        }

        @keyframes cardEntrance {
            0% {
                opacity: 0;
                transform: translateY(24px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
    </style>
</head>
<body>

    <!-- Full-Viewport High-DPI Canvas -->
    <canvas id="celebrationCanvas"></canvas>

    <!-- Centered Translucent Glassmorphic Birthday Greeting Card (Zero Interactive Chrome) -->
    <div id="cardWrapper" class="fixed inset-x-0 top-10 sm:top-12 md:top-14 z-10 flex flex-col items-center px-4 pointer-events-none">
        <div id="greetingCard" class="glass-card max-w-xl w-full rounded-3xl px-6 py-6 sm:px-10 sm:py-8 text-center">
            <!-- Decorative Top Flourish -->
            <div class="flex items-center justify-center gap-3 mb-1 sm:mb-2 opacity-85">
                <span class="h-px w-10 sm:w-16 bg-gradient-to-r from-transparent to-amber-300/70"></span>
                <svg class="w-4 h-4 text-amber-300" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z"/>
                </svg>
                <span class="h-px w-10 sm:w-16 bg-gradient-to-l from-transparent to-amber-300/70"></span>
            </div>

            <!-- Main Animated Calligraphic Headline -->
            <h1 id="headlineText" class="font-calligraphy shimmer-title text-4xl sm:text-6xl md:text-7xl leading-tight py-1">
                Happy Birthday Mumma
            </h1>

            <!-- Heartfelt Message -->
            <p id="messageText" class="font-serif-elegant text-amber-50/95 text-lg sm:text-xl md:text-2xl italic leading-relaxed mt-2 sm:mt-3 tracking-wide">
                Chahe main duniya ke kisi bhi kone mein rahoon, aapki duaaon ka asar hamesha saath rehta hai. Thank you har cheez ke liye, Mumma
            </p>

            <!-- Warm Sign-Off -->
            <p id="signatureText" class="font-serif-elegant text-amber-200/90 mt-3 sm:mt-4 tracking-widest uppercase text-xs sm:text-sm">
                With all my love
            </p>
        </div>
    </div>

    <script>
        /**
         * ============================================================================
         * COMPLETELY SELF-RUNNING BIRTHDAY ANIMATION FOR MUMMA
         * Zero buttons, zero modals, zero click requirements:
         *  - Twilight-to-starlit-night sky with twinkling stars & Heart/Crown constellations
         *  - Warm drifting sky lanterns & golden ambient fireflies/bokeh
         *  - Continuous choreographed fireworks (golden, rose-gold, champagne, heart bursts)
         *    plus periodic grand finale volleys
         *  - Unfolding blooming floral garden (roses, peonies, lilies, foliage) & butterflies
         *  - Automatic Web Audio API music box playing "Happy Birthday" on loop
         * ============================================================================
         */

        (function () {
            const canvas = document.getElementById('celebrationCanvas');
            const ctx = canvas.getContext('2d');

            // Logical viewport dimensions
            let width = window.innerWidth;
            let height = window.innerHeight;
            let dpr = Math.min(window.devicePixelRatio || 1, 2);

            // Rose-Gold, Champagne & Twilight Palette
            const THEME = {
                skyTop: '#070514',
                skyMid: '#180d2e',
                skyHorizon: '#3b183d',
                skyGlow: 'rgba(244, 114, 182, 0.24)',
                fireworkHues: [35, 42, 48, 335, 350, 18, 28],
                flowerPalettes: [
                    ['#fb7185', '#fda4af', '#ffe4e6'], // Soft Rose
                    ['#f472b6', '#f9a8d4', '#fdf2f8'], // Pink Peony
                    ['#fbbf24', '#fde68a', '#fffbeb'], // Warm Champagne Gold
                    ['#e879f9', '#f5d0fe', '#fae8ff']  // Orchid Blush
                ],
                butterflyColors: ['#fde68a', '#f9a8d4', '#fbcfe8'],
                lanternHue: 36
            };

            // Scene Collections
            let stars = [];
            let constellations = [];
            let lanterns = [];
            let fireflies = [];
            let rockets = [];
            let particles = [];
            let flowers = [];
            let grassBlades = [];
            let butterflies = [];
            let sparkles = [];

            let gardenStartTime = performance.now();
            let lastAutoFirework = 0;
            let lastGrandFinale = 0;
            let grandFinaleQueue = [];

            // Utility Random Helpers
            const rand = (min, max) => Math.random() * (max - min) + min;
            const randInt = (min, max) => Math.floor(rand(min, max + 1));
            const clamp = (val, min, max) => Math.max(min, Math.min(max, val));

            /**
             * Resize canvas cleanly with High-DPI support
             */
            function resizeCanvas() {
                width = window.innerWidth;
                height = window.innerHeight;
                dpr = Math.min(window.devicePixelRatio || 1, 2);

                canvas.width = Math.floor(width * dpr);
                canvas.height = Math.floor(height * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                initSkyAndGarden();
            }

            /**
             * Initialize Stars, Constellations, Lanterns, Fireflies, Garden, and Butterflies
             */
            function initSkyAndGarden() {
                // 1. Twinkling Starfield
                const starCount = Math.floor((width * height) / 6200);
                stars = [];
                for (let i = 0; i < starCount; i++) {
                    stars.push({
                        x: Math.random() * width,
                        y: Math.random() * (height * 0.78),
                        radius: rand(0.6, 2.2),
                        baseAlpha: rand(0.35, 0.95),
                        twinkleSpeed: rand(0.002, 0.005),
                        phase: rand(0, Math.PI * 2),
                        tint: Math.random() > 0.65 ? '#fde68a' : (Math.random() > 0.5 ? '#fbcfe8' : '#ffffff')
                    });
                }

                // 2. Heart & Crown Constellations positioned gracefully in upper corners
                constellations = [];
                const isMobile = width < 640;

                // Left Constellation: Heart
                const hx = isMobile ? width * 0.16 : width * 0.15;
                const hy = isMobile ? height * 0.12 : height * 0.21;
                const hs = isMobile ? 26 : 44;
                const heartPts = [
                    { x: hx, y: hy + hs * 0.35 },
                    { x: hx - hs * 0.55, y: hy - hs * 0.15 },
                    { x: hx - hs * 0.35, y: hy - hs * 0.55 },
                    { x: hx, y: hy - hs * 0.28 },
                    { x: hx + hs * 0.35, y: hy - hs * 0.55 },
                    { x: hx + hs * 0.55, y: hy - hs * 0.15 }
                ];
                constellations.push({ points: heartPts, closed: true, phase: 0 });

                // Right Constellation: Queen's Crown
                const cx = isMobile ? width * 0.84 : width * 0.85;
                const cy = isMobile ? height * 0.13 : height * 0.22;
                const cs = isMobile ? 26 : 45;
                const crownPts = [
                    { x: cx - cs * 0.6, y: cy + cs * 0.35 },
                    { x: cx - cs * 0.75, y: cy - cs * 0.25 },
                    { x: cx - cs * 0.3, y: cy + cs * 0.05 },
                    { x: cx, y: cy - cs * 0.45 },
                    { x: cx + cs * 0.3, y: cy + cs * 0.05 },
                    { x: cx + cs * 0.75, y: cy - cs * 0.25 },
                    { x: cx + cs * 0.6, y: cy + cs * 0.35 }
                ];
                constellations.push({ points: crownPts, closed: true, phase: 1.8 });

                // 3. Floating Sky Lanterns
                const lanternCount = isMobile ? 10 : 18;
                lanterns = [];
                for (let i = 0; i < lanternCount; i++) {
                    lanterns.push(createLantern(true));
                }

                // 4. Glowing Golden Fireflies & Bokeh Orbs
                const fireflyCount = isMobile ? 28 : 48;
                fireflies = [];
                for (let i = 0; i < fireflyCount; i++) {
                    fireflies.push({
                        x: rand(0, width),
                        y: rand(height * 0.32, height * 0.96),
                        vx: rand(-0.25, 0.25),
                        vy: rand(-0.2, 0.2),
                        radius: rand(1.8, 4.6),
                        phase: rand(0, Math.PI * 2),
                        speed: rand(0.0025, 0.006),
                        isBokeh: Math.random() > 0.62
                    });
                }

                // 5. Lush Foliage & Blooming Floral Bouquet along the Bottom
                buildFloralGarden();

                // 6. Fluttering Luminous Butterflies
                const butterflyCount = isMobile ? 6 : 9;
                butterflies = [];
                for (let i = 0; i < butterflyCount; i++) {
                    butterflies.push({
                        x: rand(width * 0.1, width * 0.9),
                        y: rand(height * 0.58, height * 0.88),
                        targetX: rand(width * 0.1, width * 0.9),
                        targetY: rand(height * 0.55, height * 0.88),
                        wingPhase: rand(0, Math.PI * 2),
                        wingSpeed: rand(0.16, 0.24),
                        size: rand(9, 14),
                        color: THEME.butterflyColors[i % THEME.butterflyColors.length],
                        angle: rand(-0.3, 0.3)
                    });
                }
            }

            /**
             * Create a single floating warm sky lantern
             */
            function createLantern(randomY = false) {
                const depth = rand(0.45, 1.15);
                return {
                    x: rand(width * 0.04, width * 0.96),
                    y: randomY ? rand(height * 0.12, height * 0.85) : height + rand(20, 80),
                    vy: -rand(0.24, 0.56) * depth,
                    swayAmp: rand(0.2, 0.6),
                    swaySpeed: rand(0.0008, 0.002),
                    swayPhase: rand(0, Math.PI * 2),
                    scale: depth,
                    flickerPhase: rand(0, Math.PI * 2)
                };
            }

            /**
             * Construct the blooming floral garden & bouquet along the bottom edge
             */
            function buildFloralGarden() {
                flowers = [];
                grassBlades = [];

                // Lush curved blades of grass & ferns
                const bladeCount = Math.floor(width / 9);
                for (let i = 0; i < bladeCount; i++) {
                    grassBlades.push({
                        x: (i / bladeCount) * width + rand(-8, 8),
                        height: rand(height * 0.06, height * 0.17),
                        lean: rand(-28, 28),
                        swayPhase: rand(0, Math.PI * 2),
                        width: rand(2, 4.5),
                        hue: randInt(135, 165),
                        lightness: randInt(14, 26)
                    });
                }

                // Layered Hero Flowers (Clustered artfully across the bottom, taller on sides & gentle arc in center)
                const flowerCount = Math.max(15, Math.floor(width / 54));
                for (let i = 0; i < flowerCount; i++) {
                    const normX = (i + 0.5) / flowerCount;
                    const x = normX * width + rand(-18, 18);

                    const distFromCenter = Math.abs(normX - 0.5) * 2;
                    const baseHeight = height * (0.11 + distFromCenter * 0.12) + rand(-18, 28);

                    const palette = THEME.flowerPalettes[i % THEME.flowerPalettes.length];
                    const type = i % 3 === 0 ? 'peony' : (i % 3 === 1 ? 'rose' : 'lily');

                    flowers.push({
                        x,
                        stemHeight: baseHeight,
                        curve: (normX - 0.5) * rand(25, 65) + rand(-15, 15),
                        bloomSize: rand(20, 35) * (0.85 + distFromCenter * 0.25),
                        petalCount: type === 'peony' ? 12 : (type === 'rose' ? 9 : 6),
                        type,
                        palette,
                        delay: i * 85 + rand(0, 160),
                        swayPhase: rand(0, Math.PI * 2),
                        hasLeafLeft: Math.random() > 0.25,
                        hasLeafRight: Math.random() > 0.25
                    });
                }

                flowers.sort((a, b) => b.stemHeight - a.stemHeight);
            }

            /**
             * Launch a Firework Rocket towards target coordinates (tx, ty)
             */
            function launchFirework(tx, ty, isGrand = false, forceHeart = false) {
                const startX = tx + rand(-60, 60);
                const startY = height * 0.92;
                const hue = THEME.fireworkHues[randInt(0, THEME.fireworkHues.length - 1)];

                rockets.push({
                    x: startX,
                    y: startY,
                    tx,
                    ty,
                    vx: (tx - startX) * 0.032,
                    vy: -Math.sqrt(Math.max(40, startY - ty)) * 0.62,
                    hue,
                    isGrand,
                    trail: [],
                    heartShape: forceHeart || (isGrand && Math.random() > 0.45)
                });
            }

            /**
             * Queue a choreographed Grand Finale volley across the sky
             */
            function triggerGrandFinale(now) {
                const positions = [0.16, 0.32, 0.5, 0.68, 0.84];
                positions.forEach((px, idx) => {
                    grandFinaleQueue.push({
                        fireAt: now + idx * 240,
                        x: width * px + rand(-25, 25),
                        y: height * (idx === 2 ? 0.16 : rand(0.18, 0.34)),
                        heart: idx === 2 || idx === 1 || idx === 3
                    });
                });
            }

            /**
             * Explode a Firework into Shimmering Golden, Rose-Gold & Heart Particles
             */
            function explodeFirework(rocket) {
                const count = rocket.isGrand ? 100 : 68;
                const baseHue = rocket.hue;

                // Subtle soft flash ring
                particles.push({
                    x: rocket.x,
                    y: rocket.y,
                    vx: 0,
                    vy: 0,
                    alpha: 0.78,
                    decay: 0.042,
                    size: 4,
                    maxRadius: rocket.isGrand ? 100 : 68,
                    hue: baseHue,
                    isRing: true
                });

                for (let i = 0; i < count; i++) {
                    let vx, vy;
                    if (rocket.heartShape) {
                        // Parametric Heart Burst
                        const t = (i / count) * Math.PI * 2;
                        const hx = 16 * Math.pow(Math.sin(t), 3);
                        const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                        const scale = rand(0.25, 0.35);
                        vx = hx * scale;
                        vy = hy * scale;
                    } else {
                        const angle = (i / count) * Math.PI * 2 + rand(-0.08, 0.08);
                        const speed = rand(1.6, rocket.isGrand ? 7.0 : 5.3);
                        vx = Math.cos(angle) * speed;
                        vy = Math.sin(angle) * speed;
                    }

                    particles.push({
                        x: rocket.x,
                        y: rocket.y,
                        vx,
                        vy,
                        gravity: 0.045,
                        friction: 0.965,
                        alpha: 1,
                        decay: rand(0.011, 0.020),
                        size: rand(1.6, 3.3),
                        hue: Math.random() > 0.35 ? baseHue : 44,
                        sparkle: Math.random() > 0.28
                    });
                }

                playSparkleChime();
            }

            /**
             * Render Sky Gradient, Moonlit Halo, Stars & Constellations
             */
            function drawSky(time) {
                const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
                skyGrad.addColorStop(0, THEME.skyTop);
                skyGrad.addColorStop(0.55, THEME.skyMid);
                skyGrad.addColorStop(1, THEME.skyHorizon);
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, width, height);

                // Warm Ambient Horizon Glow
                const horizonGlow = ctx.createRadialGradient(
                    width * 0.5, height * 0.95, 20,
                    width * 0.5, height * 0.95, width * 0.78
                );
                horizonGlow.addColorStop(0, THEME.skyGlow);
                horizonGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = horizonGlow;
                ctx.fillRect(0, 0, width, height);

                // Twinkling Stars
                for (let i = 0; i < stars.length; i++) {
                    const s = stars[i];
                    const twinkle = Math.sin(time * s.twinkleSpeed + s.phase);
                    const alpha = clamp(s.baseAlpha + twinkle * 0.35, 0.12, 1);

                    ctx.save();
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = s.tint;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                    ctx.fill();

                    if (s.radius > 1.65 && twinkle > 0.35) {
                        ctx.strokeStyle = s.tint;
                        ctx.lineWidth = 0.7;
                        const len = s.radius * 3.2;
                        ctx.beginPath();
                        ctx.moveTo(s.x - len, s.y);
                        ctx.lineTo(s.x + len, s.y);
                        ctx.moveTo(s.x, s.y - len);
                        ctx.lineTo(s.x, s.y + len);
                        ctx.stroke();
                    }
                    ctx.restore();
                }

                // Glowing Constellations (Heart & Crown)
                for (let c = 0; c < constellations.length; c++) {
                    const con = constellations[c];
                    const pulse = 0.38 + Math.sin(time * 0.002 + con.phase) * 0.18;

                    ctx.save();
                    ctx.strokeStyle = `rgba(253, 230, 138, ${pulse})`;
                    ctx.lineWidth = 1.1;
                    ctx.setLineDash([4, 4]);
                    ctx.beginPath();
                    con.points.forEach((pt, idx) => {
                        if (idx === 0) ctx.moveTo(pt.x, pt.y);
                        else ctx.lineTo(pt.x, pt.y);
                    });
                    if (con.closed) ctx.closePath();
                    ctx.stroke();
                    ctx.setLineDash([]);

                    con.points.forEach((pt) => {
                        const glow = ctx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, 8.5);
                        glow.addColorStop(0, 'rgba(255, 251, 235, 0.95)');
                        glow.addColorStop(0.5, 'rgba(253, 224, 71, 0.38)');
                        glow.addColorStop(1, 'rgba(253, 224, 71, 0)');
                        ctx.fillStyle = glow;
                        ctx.beginPath();
                        ctx.arc(pt.x, pt.y, 8.5, 0, Math.PI * 2);
                        ctx.fill();
                    });
                    ctx.restore();
                }
            }

            /**
             * Update & Draw Drifting Warm Sky Lanterns
             */
            function updateAndDrawLanterns(time) {
                for (let i = 0; i < lanterns.length; i++) {
                    const l = lanterns[i];
                    l.y += l.vy;
                    l.x += Math.sin(time * l.swaySpeed + l.swayPhase) * l.swayAmp;

                    if (l.y < -70) {
                        lanterns[i] = createLantern(false);
                        continue;
                    }

                    const flicker = 0.88 + Math.sin(time * 0.015 + l.flickerPhase) * 0.12;
                    const w = 18 * l.scale;
                    const h = 25 * l.scale;

                    ctx.save();
                    ctx.translate(l.x, l.y);

                    const halo = ctx.createRadialGradient(0, 0, 2, 0, 0, w * 2.4);
                    halo.addColorStop(0, `hsla(${THEME.lanternHue}, 100%, 72%, ${0.32 * flicker})`);
                    halo.addColorStop(1, `hsla(${THEME.lanternHue}, 100%, 50%, 0)`);
                    ctx.fillStyle = halo;
                    ctx.beginPath();
                    ctx.arc(0, 0, w * 2.4, 0, Math.PI * 2);
                    ctx.fill();

                    const bodyGrad = ctx.createLinearGradient(0, -h * 0.5, 0, h * 0.5);
                    bodyGrad.addColorStop(0, `hsla(${THEME.lanternHue - 10}, 90%, 55%, 0.85)`);
                    bodyGrad.addColorStop(0.65, `hsla(${THEME.lanternHue + 4}, 100%, 68%, 0.92)`);
                    bodyGrad.addColorStop(1, `hsla(48, 100%, 88%, ${0.98 * flicker})`);

                    ctx.fillStyle = bodyGrad;
                    ctx.beginPath();
                    ctx.moveTo(-w * 0.42, -h * 0.5);
                    ctx.quadraticCurveTo(0, -h * 0.62, w * 0.42, -h * 0.5);
                    ctx.lineTo(w * 0.32, h * 0.5);
                    ctx.lineTo(-w * 0.32, h * 0.5);
                    ctx.closePath();
                    ctx.fill();

                    ctx.fillStyle = `rgba(255, 253, 230, ${0.9 * flicker})`;
                    ctx.beginPath();
                    ctx.arc(0, h * 0.25, w * 0.16, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.restore();
                }
            }

            /**
             * Update & Draw Automated Fireworks and Sparkle Particles
             */
            function updateAndDrawFireworks() {
                for (let i = rockets.length - 1; i >= 0; i--) {
                    const r = rockets[i];
                    r.trail.push({ x: r.x, y: r.y });
                    if (r.trail.length > 10) r.trail.shift();

                    r.x += r.vx;
                    r.y += r.vy;
                    r.vy += 0.08;

                    for (let t = 0; t < r.trail.length; t++) {
                        const pt = r.trail[t];
                        const ratio = t / r.trail.length;
                        ctx.fillStyle = `hsla(${r.hue}, 95%, 75%, ${ratio * 0.7})`;
                        ctx.beginPath();
                        ctx.arc(pt.x, pt.y, ratio * 2.5, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    if (r.y <= r.ty || r.vy >= -0.5) {
                        explodeFirework(r);
                        rockets.splice(i, 1);
                    }
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.alpha -= p.decay;
                    if (p.alpha <= 0) {
                        particles.splice(i, 1);
                        continue;
                    }

                    if (p.isRing) {
                        p.size += (p.maxRadius - p.size) * 0.12;
                        ctx.save();
                        ctx.strokeStyle = `hsla(${p.hue}, 95%, 78%, ${p.alpha * 0.5})`;
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.restore();
                        continue;
                    }

                    p.vx *= p.friction;
                    p.vy *= p.friction;
                    p.vy += p.gravity;
                    p.x += p.vx;
                    p.y += p.vy;

                    const twinkle = p.sparkle ? (0.6 + Math.random() * 0.4) : 1;
                    ctx.save();
                    ctx.globalCompositeOperation = 'lighter';
                    ctx.fillStyle = `hsla(${p.hue}, 98%, 74%, ${p.alpha * twinkle})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            /**
             * Draw the Unfolding Blooming Floral Garden along the Bottom
             */
            function drawFloralGarden(now, time) {
                const elapsed = now - gardenStartTime;

                const meadowGrad = ctx.createLinearGradient(0, height * 0.86, 0, height);
                meadowGrad.addColorStop(0, 'rgba(13, 28, 24, 0)');
                meadowGrad.addColorStop(0.45, 'rgba(12, 26, 22, 0.85)');
                meadowGrad.addColorStop(1, '#07120f');
                ctx.fillStyle = meadowGrad;
                ctx.fillRect(0, height * 0.86, width, height * 0.14);

                for (let i = 0; i < grassBlades.length; i++) {
                    const g = grassBlades[i];
                    const sway = Math.sin(time * 0.0018 + g.swayPhase) * 8;
                    ctx.strokeStyle = `hsla(${g.hue}, 42%, ${g.lightness}%, 0.78)`;
                    ctx.lineWidth = g.width;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(g.x, height);
                    ctx.quadraticCurveTo(
                        g.x + g.lean * 0.4,
                        height - g.height * 0.55,
                        g.x + g.lean + sway,
                        height - g.height
                    );
                    ctx.stroke();
                }

                for (let i = 0; i < flowers.length; i++) {
                    const f = flowers[i];
                    const rawProgress = clamp((elapsed - f.delay) / 2200, 0, 1);
                    if (rawProgress <= 0) continue;

                    const stemProgress = clamp(rawProgress * 1.4, 0, 1);
                    const easeStem = 1 - Math.pow(1 - stemProgress, 3);
                    const bloomProgress = clamp((rawProgress - 0.35) / 0.65, 0, 1);
                    const easeBloom = 1 - Math.pow(1 - bloomProgress, 3);

                    const sway = Math.sin(time * 0.0015 + f.swayPhase) * 7 * easeStem;
                    const startX = f.x;
                    const startY = height + 4;
                    const tipX = f.x + (f.curve + sway) * easeStem;
                    const tipY = height - f.stemHeight * easeStem;
                    const ctrlX = f.x + f.curve * 0.35 * easeStem;
                    const ctrlY = height - f.stemHeight * 0.52 * easeStem;

                    ctx.strokeStyle = '#1f4e3d';
                    ctx.lineWidth = 3.2;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(startX, startY);
                    ctx.quadraticCurveTo(ctrlX, ctrlY, tipX, tipY);
                    ctx.stroke();

                    if (easeStem > 0.45) {
                        const leafScale = clamp((easeStem - 0.45) / 0.55, 0, 1);
                        const midX = (startX + tipX) * 0.5 + f.curve * 0.15;
                        const midY = (startY + tipY) * 0.52;

                        if (f.hasLeafLeft) drawLeaf(midX, midY, -0.65, 18 * leafScale);
                        if (f.hasLeafRight) drawLeaf(midX, midY - 8, 0.65, 17 * leafScale);
                    }

                    if (easeBloom > 0.01) {
                        drawFlowerHead(tipX, tipY, f, easeBloom, time);
                    }
                }
            }

            /**
             * Helper to draw an emerald botanical leaf
             */
            function drawLeaf(x, y, angle, length) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angle);
                const grad = ctx.createLinearGradient(0, 0, length, 0);
                grad.addColorStop(0, '#163d30');
                grad.addColorStop(1, '#2d7a5e');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(length * 0.5, -length * 0.42, length, 0);
                ctx.quadraticCurveTo(length * 0.5, length * 0.42, 0, 0);
                ctx.fill();
                ctx.restore();
            }

            /**
             * Helper to draw a layered glowing Rose, Peony, or Lily blossom
             */
            function drawFlowerHead(x, y, flower, bloom, time) {
                const size = flower.bloomSize * bloom;
                const [outerCol, midCol, innerCol] = flower.palette;

                ctx.save();
                ctx.translate(x, y);

                const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, size * 1.55);
                glow.addColorStop(0, outerCol + '55');
                glow.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(0, 0, size * 1.55, 0, Math.PI * 2);
                ctx.fill();

                const count = flower.petalCount;
                for (let p = 0; p < count; p++) {
                    const ang = (p / count) * Math.PI * 2 + Math.sin(time * 0.001 + flower.swayPhase) * 0.05;
                    ctx.save();
                    ctx.rotate(ang);
                    ctx.fillStyle = outerCol;
                    ctx.beginPath();
                    ctx.ellipse(size * 0.52, 0, size * 0.52, size * (flower.type === 'lily' ? 0.22 : 0.36), 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                const midCount = Math.max(5, count - 2);
                for (let p = 0; p < midCount; p++) {
                    const ang = (p / midCount) * Math.PI * 2 + 0.35;
                    ctx.save();
                    ctx.rotate(ang);
                    ctx.fillStyle = midCol;
                    ctx.beginPath();
                    ctx.ellipse(size * 0.34, 0, size * 0.36, size * 0.25, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                ctx.fillStyle = innerCol;
                ctx.beginPath();
                ctx.arc(0, 0, size * 0.24, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#fbbf24';
                ctx.beginPath();
                ctx.arc(0, 0, size * 0.12, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            /**
             * Update & Draw Fluttering Luminous Butterflies
             */
            function updateAndDrawButterflies() {
                for (let i = 0; i < butterflies.length; i++) {
                    const b = butterflies[i];
                    b.wingPhase += b.wingSpeed;

                    const dx = b.targetX - b.x;
                    const dy = b.targetY - b.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist < 24) {
                        b.targetX = rand(width * 0.08, width * 0.92);
                        b.targetY = rand(height * 0.54, height * 0.87);
                    } else {
                        b.x += (dx / dist) * 1.15;
                        b.y += (dy / dist) * 0.95 + Math.sin(b.wingPhase * 0.5) * 0.45;
                        b.angle = Math.atan2(dy, dx) * 0.25;
                    }

                    if (Math.random() > 0.72) {
                        sparkles.push({
                            x: b.x + rand(-4, 4),
                            y: b.y + rand(-4, 4),
                            vy: rand(0.1, 0.4),
                            alpha: 0.9,
                            size: rand(1, 2.2),
                            color: b.color
                        });
                    }

                    const wingSpan = Math.abs(Math.cos(b.wingPhase));
                    ctx.save();
                    ctx.translate(b.x, b.y);
                    ctx.rotate(b.angle);

                    const glow = ctx.createRadialGradient(0, 0, 1, 0, 0, b.size * 1.8);
                    glow.addColorStop(0, b.color + '66');
                    glow.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(0, 0, b.size * 1.8, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = b.color;
                    ctx.beginPath();
                    ctx.ellipse(-b.size * 0.45 * wingSpan, -b.size * 0.2, b.size * 0.65 * wingSpan, b.size * 0.42, -0.35, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.beginPath();
                    ctx.ellipse(b.size * 0.45 * wingSpan, -b.size * 0.2, b.size * 0.65 * wingSpan, b.size * 0.42, 0.35, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.restore();
                }

                for (let i = sparkles.length - 1; i >= 0; i--) {
                    const sp = sparkles[i];
                    sp.y += sp.vy;
                    sp.alpha -= 0.025;
                    if (sp.alpha <= 0) {
                        sparkles.splice(i, 1);
                        continue;
                    }
                    ctx.fillStyle = sp.color;
                    ctx.globalAlpha = sp.alpha;
                    ctx.beginPath();
                    ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }
            }

            /**
             * Update & Draw Ambient Golden Fireflies and Bokeh Orbs
             */
            function updateAndDrawFireflies(time) {
                for (let i = 0; i < fireflies.length; i++) {
                    const f = fireflies[i];
                    f.x += f.vx + Math.sin(time * 0.001 + f.phase) * 0.2;
                    f.y += f.vy + Math.cos(time * 0.0012 + f.phase) * 0.18;

                    if (f.x < -10) f.x = width + 10;
                    if (f.x > width + 10) f.x = -10;
                    if (f.y < height * 0.25) f.y = height * 0.95;
                    if (f.y > height) f.y = height * 0.35;

                    const pulse = 0.45 + Math.sin(time * f.speed + f.phase) * 0.45;
                    const r = f.isBokeh ? f.radius * 3.2 : f.radius * 2.2;

                    const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r);
                    if (f.isBokeh) {
                        grad.addColorStop(0, `rgba(249, 168, 212, ${0.22 * pulse})`);
                        grad.addColorStop(1, 'rgba(249, 168, 212, 0)');
                    } else {
                        grad.addColorStop(0, `rgba(254, 240, 138, ${0.95 * pulse})`);
                        grad.addColorStop(0.4, `rgba(251, 191, 36, ${0.35 * pulse})`);
                        grad.addColorStop(1, 'rgba(251, 191, 36, 0)');
                    }

                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(f.x, f.y, r, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            /**
             * Main 60fps Self-Running Animation Loop
             */
            function animate(now) {
                // Continuous organic fireworks every ~1.7 seconds
                if (now - lastAutoFirework > 1750) {
                    lastAutoFirework = now;
                    const isHeart = Math.random() > 0.62;
                    launchFirework(
                        rand(width * 0.14, width * 0.86),
                        rand(height * 0.13, height * 0.44),
                        Math.random() > 0.45,
                        isHeart
                    );
                }

                // Periodic Grand Finale volley every ~12 seconds (and shortly after load)
                if (now - lastGrandFinale > 12000) {
                    lastGrandFinale = now;
                    triggerGrandFinale(now);
                }

                // Process scheduled Grand Finale volleys
                for (let i = grandFinaleQueue.length - 1; i >= 0; i--) {
                    const item = grandFinaleQueue[i];
                    if (now >= item.fireAt) {
                        launchFirework(item.x, item.y, true, item.heart);
                        grandFinaleQueue.splice(i, 1);
                    }
                }

                drawSky(now);
                updateAndDrawLanterns(now);
                updateAndDrawFireworks();
                drawFloralGarden(now, now);
                updateAndDrawButterflies();
                updateAndDrawFireflies(now);

                requestAnimationFrame(animate);
            }

            /**
             * ========================================================================
             * AUTOMATIC WEB AUDIO API MUSIC BOX ("Happy Birthday" Melodic Loop)
             * Starts automatically on load and seamlessly resumes on any passive
             * browser interaction if suspended by browser autoplay policy.
             * ========================================================================
             */
            let audioCtx = null;
            let melodyRunning = false;
            let melodyTimer = null;
            let noteIndex = 0;

            const NOTES = {
                C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23,
                G4: 392.00, A4: 440.00, Bb4: 466.16, C5: 523.25,
                D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99
            };

            const HAPPY_BIRTHDAY_MELODY = [
                { f: NOTES.C5, d: 380 }, { f: NOTES.C5, d: 220 }, { f: NOTES.D5, d: 600 },
                { f: NOTES.C5, d: 600 }, { f: NOTES.F5, d: 600 }, { f: NOTES.E5, d: 1100 },

                { f: NOTES.C5, d: 380 }, { f: NOTES.C5, d: 220 }, { f: NOTES.D5, d: 600 },
                { f: NOTES.C5, d: 600 }, { f: NOTES.G5, d: 600 }, { f: NOTES.F5, d: 1100 },

                { f: NOTES.C5, d: 380 }, { f: NOTES.C5, d: 220 }, { f: NOTES.C5 * 2, d: 600 },
                { f: NOTES.A4 * 2, d: 600 }, { f: NOTES.F5, d: 600 }, { f: NOTES.E5, d: 600 }, { f: NOTES.D5, d: 1100 },

                { f: NOTES.Bb4 * 2, d: 380 }, { f: NOTES.Bb4 * 2, d: 220 }, { f: NOTES.A4 * 2, d: 600 },
                { f: NOTES.F5, d: 600 }, { f: NOTES.G5, d: 600 }, { f: NOTES.F5, d: 1400 }
            ];

            function ensureAudioStarted() {
                try {
                    if (!audioCtx) {
                        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                        if (!AudioContextClass) return;
                        audioCtx = new AudioContextClass();
                    }
                    if (audioCtx.state === 'suspended') {
                        audioCtx.resume().catch(() => {});
                    }
                    if (!melodyRunning) {
                        melodyRunning = true;
                        stepMelody();
                    }
                } catch (e) {
                    // Fail silently if Web Audio is unavailable
                }
            }

            function playMusicBoxNote(freq, durationMs = 800, volume = 0.08) {
                if (!audioCtx || audioCtx.state !== 'running') return;

                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const overtone = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now);

                overtone.type = 'triangle';
                overtone.frequency.setValueAtTime(freq * 2, now);

                const overtoneGain = audioCtx.createGain();
                overtoneGain.gain.setValueAtTime(volume * 0.18, now);
                overtoneGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);

                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.linearRampToValueAtTime(volume, now + 0.015);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + (durationMs / 1000) + 0.9);

                osc.connect(gain);
                overtone.connect(overtoneGain);
                overtoneGain.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                overtone.start(now);
                osc.stop(now + (durationMs / 1000) + 1.0);
                overtone.stop(now + 0.4);
            }

            function playSparkleChime() {
                if (!audioCtx || audioCtx.state !== 'running') return;
                const chimePool = [NOTES.C5 * 2, NOTES.E5 * 2, NOTES.G5 * 2, NOTES.A4 * 2];
                const freq = chimePool[randInt(0, chimePool.length - 1)];
                playMusicBoxNote(freq, 500, 0.03);
            }

            function stepMelody() {
                const step = HAPPY_BIRTHDAY_MELODY[noteIndex];
                if (audioCtx && audioCtx.state === 'running') {
                    playMusicBoxNote(step.f, step.d, 0.085);
                    noteIndex = (noteIndex + 1) % HAPPY_BIRTHDAY_MELODY.length;
                }
                const pause = noteIndex === 0 ? 1500 : step.d;
                melodyTimer = setTimeout(stepMelody, pause);
            }

            // Passive listeners to unlock/resume AudioContext seamlessly without any UI prompt
            const passiveEvents = ['pointermove', 'pointerdown', 'touchstart', 'scroll', 'keydown', 'visibilitychange'];
            passiveEvents.forEach((evt) => {
                window.addEventListener(evt, () => {
                    if (document.visibilityState !== 'hidden') {
                        ensureAudioStarted();
                    }
                }, { passive: true });
            });

            window.addEventListener('resize', resizeCanvas);

            // Start everything automatically on window load
            window.onload = function () {
                resizeCanvas();
                gardenStartTime = performance.now();
                lastGrandFinale = gardenStartTime - 10200; // Opening grand finale 1.8s after load
                ensureAudioStarted();
                requestAnimationFrame(animate);
            };
        })();
    </script>
</body>
</html>
